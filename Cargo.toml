[workspace]
members = ["crates/core", "crates/server", "crates/cli", "crates/gui"]
default-members = ["crates/core", "crates/server", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/valtronforever/paylink-emulator"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full", "test-util"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
